<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Smart Kiosk Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Fonte de emoji colorida do Google Fonts: garante que os emojis do -->
  <!-- ICON_MAP (e qualquer outro emoji usado no app) renderizem de forma -->
  <!-- consistente, já que o Android antigo do tablet não tem uma boa -->
  <!-- fonte de emoji nativa. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app-shell">

    <!-- ===================== SIDEBAR ===================== -->
    <aside class="sidebar">
      <div class="sidebar__brand">
        <span class="sidebar__brand-dot"></span>
        <span class="sidebar__brand-text">KIOSK</span>
      </div>

      <nav id="device-tabs" class="device-tabs">
        <p class="device-tabs__empty">Procurando dispositivos&hellip;</p>
      </nav>

      <div class="sidebar__footer">
        <span id="broker-status" class="broker-status broker-status--offline">
          <span class="broker-status__dot"></span> Conectando
        </span>
      </div>
    </aside>

    <!-- ===================== MAIN AREA ===================== -->
    <main class="main">
      <header class="main__header">
        <div class="main__title-group">
          <h1 id="device-title" class="main__title">Selecione um dispositivo</h1>
          <span id="device-status-badge" class="badge badge--offline">&mdash;</span>
        </div>

        <!-- Botão do Mixer agora no topo, sempre acessível -->
        <button id="btn-toggle-mixer" class="btn-pill btn-pill--header" type="button">
          &#127925; Mixer de Apps
        </button>
      </header>

      <div class="main__body">
        <div id="main-content" class="main-content">

          <!-- Widget Now Playing -->
          <div id="now-playing" class="now-playing now-playing--empty">
            <span id="np-icon" class="np-icon">&#127925;</span>
            <div class="np-info">
              <div id="np-title" class="np-title">Nenhuma mídia tocando</div>
              <div id="np-artist" class="np-artist">-</div>
            </div>
          </div>

          <!-- GRID UNIFICADA DE ATALHOS E SLIDERS -->
          <div id="shortcuts-grid" class="shortcuts-grid">
            <p class="shortcuts-empty">Sem atalhos configurados.</p>
          </div>

        </div>

        <!-- Overlay de offline -->
        <div id="offline-overlay" class="offline-overlay">
          <span class="offline-overlay__icon">&#9889;</span>
          <p>Dispositivo offline</p>
        </div>
      </div>
    </main>

  </div>

  <!-- ===================== DRAWER DO MIXER ===================== -->
  <div id="mixer-drawer" class="mixer-drawer">
    <div id="mixer-backdrop" class="mixer-drawer__backdrop"></div>
    <div class="mixer-drawer__panel">
      <header class="mixer-drawer__header">
        <h2>Mixer de Aplicações</h2>
        <button id="btn-close-mixer" class="btn-icon" type="button" aria-label="Fechar">&times;</button>
      </header>
      <div id="mixer-apps-list" class="mixer-apps-list">
        <p class="mixer-empty-msg">Nenhuma aplicação de áudio ativa.</p>
      </div>
    </div>
  </div>
<div id="debug-log" style="position:fixed;bottom:0;left:0;right:0;height:150px;background:rgba(0,0,0,0.85);color:#0f0;font-family:monospace;font-size:12px;padding:10px;z-index:9999;overflow-y:auto;pointer-events:none;backdrop-filter:blur(4px);"></div>
  <script>
    var dbg = document.getElementById('debug-log');
    window.logMsg = function(msg, color) {
      var c = color ? color : '#0f0';
      dbg.innerHTML += '<div style="color:' + c + '">[' + new Date().toLocaleTimeString() + '] ' + msg + '</div>';
      dbg.scrollTop = dbg.scrollHeight;
    };
    window.onerror = function(msg, src, line) { 
      window.logMsg('JS ERROR: ' + msg + ' (Linha ' + line + ')', '#f55'); 
    };
  </script>

  <script src="mqtt.min.js"></script>
  <!-- ALERTA: MUDE O NOME DO ARQUIVO AQUI PARA QUEBRAR O CACHE -->
  <script src="app.js"></script>
</body>
</html>
